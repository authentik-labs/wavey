display_information:
  name: Standup Bot
  description: Modular Slack bot. Runs daily standups and files GitHub issues from threads.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: standup-bot
    always_online: true
  slash_commands:
    - command: /standup-setup
      description: Configure the standup destination channel, defaults and schedule (admin only)
      should_escape: false
    - command: /standup-time
      description: Set your own timezone, send time or reminder delay
      should_escape: false
    - command: /standup-now
      description: Fill out today's standup right now
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - im:history
      - users:read
      - channels:read
      - groups:read
      - conversations.connect:write
      # standup module: join a public destination channel to read its membership
      - channels:join
      # github module: read @-mentions and the thread they happen in
      - app_mentions:read
      - channels:history
      - groups:history
      - mpim:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
      # standup module: keep participants in step with the destination channel
      - member_joined_channel
      - member_left_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
